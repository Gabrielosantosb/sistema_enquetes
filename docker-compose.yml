services:
  postgres:
    image: postgres:16-alpine
    container_name: enquetes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: enquetes
      POSTGRES_PASSWORD: enquetes
      POSTGRES_DB: enquetes
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enquetes -d enquetes']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
